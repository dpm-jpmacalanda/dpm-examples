configs:

#
# Dashboard that works based on events, metrics and SDLC events
# Application Sync Events section with Copilot Failed Syncs analyse
#
- id: argocd_app_lifecycle_observability
  config:
    name: ArgoCD Application Lifecycle
    template: argocd_app_lifecycle_observability.json
    skip: false
  type:
    document:
      kind: dashboard
      private: false

#
# Dashboard to observe ArgoCD Infrastructure
#
- id: argocd_platform_observability
  config:
    name: ArgoCD Platform Observability
    template: argocd_platform_observability.json
    skip: false
  type:
    document:
      kind: dashboard
      private: false

#
# Dashboard: current version per Argo CD application (DPM addition)
# Needs the enriched SDLC event fields (argocd.app.version) and Argo CD metrics
#
- id: argocd_app_versions
  config:
    name: ArgoCD Applications and Versions
    template: argocd_app_versions.json
    skip: false
  type:
    document:
      kind: dashboard
      private: false
